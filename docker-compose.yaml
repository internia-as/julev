services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-ordbok}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "3306:3306"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  db-migrate:
    build:
      context: .
      args:
        NEXT_PUBLIC_SIKOR_URL: ${NEXT_PUBLIC_SIKOR_URL:-https://gtweb.uit.no/korp/}
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: mysql://root:${DB_ROOT_PASSWORD:-root}@db:3306/${DB_NAME:-ordbok}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SIKOR_URL: ${NEXT_PUBLIC_SIKOR_URL:-https://gtweb.uit.no/korp/}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://root:${DB_ROOT_PASSWORD:-root}@db:3306/${DB_NAME:-ordbok}
      REDIS_URL: redis://redis:6379
      DIVVUN_API_URL: ${DIVVUN_API_URL:-https://satni.uit.no/newsatni/}
      NEXT_PUBLIC_SIKOR_URL: ${NEXT_PUBLIC_SIKOR_URL:-https://gtweb.uit.no/korp/}
      TRANSLATE_URL: ${TRANSLATE_URL:-https://gtweb-02.uit.no/apertium-api/translate}
      TEXT_TO_SPEECH_URL: ${TEXT_TO_SPEECH_URL:-https://api-giellalt.uit.no/tts}
      GRAMMAR_CHECKER_URL: ${GRAMMAR_CHECKER_URL:-https://api-giellalt.uit.no/grammar}
      KARTVERKET_URL: ${KARTVERKET_URL:-https://ws.geonorge.no/stedsnavn/v1/sted}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

volumes:
  redis-data:
  db-data:
